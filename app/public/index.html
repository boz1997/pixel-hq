<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel HQ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1c1a24; color: #e6e8ef; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #top { display: flex; gap: 16px; align-items: center; padding: 8px 14px; background: #121118; border-bottom: 1px solid #2d2a3a; position: sticky; top: 0; z-index: 2; }
  #top b { color: #f2c037; letter-spacing: 1px; }
  #top .dim { color: #8a8fa6; }
  #top .warn { color: #f5b82e; }
  #wrap { display: flex; align-items: flex-start; }
  #stage { flex: 1; overflow: auto; padding: 12px; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; max-width: 1536px; margin: 0 auto; background: #4b3a2f; border: 2px solid #2d2a3a; }
  #panel { width: 330px; min-height: calc(100vh - 42px); padding: 14px; background: #121118; border-left: 1px solid #2d2a3a; display: none; }
  #panel.open { display: block; }
  #panel h2 { margin: 0 0 4px; font-size: 15px; color: #fff; }
  #panel .room { color: #8a8fa6; margin-bottom: 10px; }
  #panel .state { padding: 6px 8px; border-radius: 6px; background: #1f2130; margin-bottom: 10px; }
  #panel .state.working { border-left: 3px solid #3ecf6e; }
  #panel .state.waiting { border-left: 3px solid #f5b82e; }
  #panel .state.idle { border-left: 3px solid #8fb4e8; }
  #panel .state.done { border-left: 3px solid #2e9d57; }
  #panel .state.failed { border-left: 3px solid #e5534b; }
  #panel .state.away { border-left: 3px solid #9aa0b5; color: #9aa0b5; }
  #panel h3 { margin: 12px 0 4px; font-size: 11px; color: #8a8fa6; letter-spacing: 1px; text-transform: uppercase; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 3px 0; border-bottom: 1px dashed #2d2a3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel li .t { color: #6b7080; margin-right: 6px; }
  #panel li .who { color: #3d6fd6; }
  #panel .actions { display: flex; gap: 8px; margin-top: 12px; }
  #panel a, #panel button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #3d4258; background: #1f2130; color: #e6e8ef; text-decoration: none; cursor: pointer; }
  #panel a.primary { background: #3d6fd6; border-color: #3d6fd6; color: #fff; }
  #panel .close { float: right; color: #8a8fa6; cursor: pointer; }
  @media (max-width: 760px) {
    #wrap { flex-direction: column; }
    #panel { width: 100%; min-height: 0; border-left: 0; border-top: 1px solid #2d2a3a; }
    #stage { padding: 6px; }
    #top { flex-wrap: wrap; gap: 6px 14px; }
  }
  #gate { position: fixed; inset: 0; background: #1c1a24; display: none; align-items: center; justify-content: center; z-index: 5; }
  #gate.open { display: flex; }
  #gate form { background: #121118; padding: 24px; border-radius: 10px; border: 1px solid #2d2a3a; width: 320px; }
  #gate input { width: 100%; font: inherit; padding: 8px; margin: 10px 0; background: #1f2130; border: 1px solid #3d4258; color: #fff; border-radius: 6px; }
  #gate button { font: inherit; padding: 8px 12px; background: #3d6fd6; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #gate .err { color: #e5534b; min-height: 1.2em; }
</style>
</head>
<body>
<div id="top">
  <b>PIXEL HQ</b>
  <span id="counts" class="dim">loading…</span>
  <span id="fresh" class="dim"></span>
  <span id="mode" class="dim"></span>
</div>
<div id="wrap">
  <div id="stage"><canvas id="office" width="768" height="672"></canvas></div>
  <aside id="panel"></aside>
</div>
<div id="gate">
  <form id="gate-form">
    <div>This office is behind a password.</div>
    <input id="gate-pw" type="password" placeholder="password" autofocus>
    <div class="err" id="gate-err"></div>
    <button type="submit">Enter</button>
  </form>
</div>
<script type="module" src="./office.js"></script>
</body>
</html>
